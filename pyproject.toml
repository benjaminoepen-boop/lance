[project]
name = "lance"
version = "0.1.0"
description = "Lance: plan your Nova SBE course bidding. Team project, Introduction to Programming, Nova SBE 2026/27. Grew out of the solo project Festival Architect."
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pdfplumber>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
