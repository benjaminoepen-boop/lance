{% extends "base.html" %}
{% block title %}Lance · Planner{% endblock %}
{% block head %}{% with page_title="Planner", action='<a class="btn primary" href="' ~ url_for('bids') ~ '">Set bids</a>' %}{% include "_head.html" %}{% endwith %}{% endblock %}
{% block content %}
<div class="mobile-switch"><div class="seg" role="group" aria-label="View">
  <button type="button" data-view="courses" class="on">Courses</button>
  <button type="button" data-view="week">Week</button>
</div></div>
<div class="planner" id="planner" data-view="courses">
  <section class="catalog" aria-label="Courses">
    <div class="tools">
      <input class="field" type="search" id="search" placeholder="Course, lecturer or code" aria-label="Search courses">
      <div class="row" id="filter-kind" role="group" aria-label="How it counts">
        <button type="button" class="chip on" data-kind="all">All</button>
        <button type="button" class="chip" data-kind="mandatory">Mandatory</button>
        <button type="button" class="chip" data-kind="elective">Elective</button>
        <button type="button" class="chip" data-kind="outside">Outside</button>
      </div>
      <div class="row">
        <div id="filter-term" class="row" role="group" aria-label="Term"></div>
        <label class="check small" style="margin-left:auto"><input type="checkbox" id="fits"><span>Fits my week</span></label>
      </div>
    </div>
    <div class="course-list" id="courses"></div>
  </section>
  <section class="week-area" aria-label="Your week">
    <div class="card" id="week-card">
      <div class="week-top">
        <div class="seg" id="week-tabs" role="group" aria-label="Term"></div>
        <a class="btn small" href="{{ url_for('calendar_download') }}" title="Every class and exam with its real date, including make-up days">Calendar file</a>
      </div>
      <div class="week" id="week"></div>
    </div>
    <div class="stack" id="clashes"></div>
    <div class="card" id="exams-card"><h2>Exams and midterms</h2><div class="exam-grid" id="exams"></div></div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='planner.js') }}"></script>{% endblock %}
