<header class="card head" id="head">
  <h1 class="sr">{{ page_title }}</h1>
  <div class="settings">
    <select class="field" id="set-programme" aria-label="Your programme">
      {% for name in programmes %}<option value="{{ name }}" {{ 'selected' if name == plan.programme }}>{{ name }}</option>{% endfor %}
    </select>
    <div class="seg" role="group" aria-label="Semester">
      <button type="button" data-semester="Fall" class="{{ 'on' if plan.semester == 'Fall' }}">Fall</button>
      <button type="button" data-semester="Spring" class="{{ 'on' if plan.semester == 'Spring' }}">Spring</button>
    </div>
    <label class="points-field" title="Your balance at the start of the semester, shown on the platform next to 'Balance'">
      <input class="field num" id="set-points" type="number" min="0" max="2000" step="1" inputmode="numeric" value="{{ plan.points }}" aria-label="Your points"><span class="muted">points</span>
    </label>
    <label class="check small" title="On the platform, part of the students with 45 or more ECTS passed rank with their bid × 1.1. Nova does not explain who. Tick this if your rank list shows it for you.">
      <input type="checkbox" id="set-bonus" {{ 'checked' if plan.has_bonus }}><span>+10&nbsp;% rank</span>
    </label>
  </div>
  <div class="kpis">
    <div class="kpi" id="kpi-ects"><b class="num">–</b><span>ECTS</span></div>
    <div class="kpi" id="kpi-points"><b class="num">–</b><span>points bid</span></div>
    <div class="kpi" id="kpi-clashes"><b class="num">–</b><span>clashes</span></div>
    <div class="kpi" id="kpi-next"><b class="num">–</b><span>–</span></div>
    {% block action %}{{ action|safe }}{% endblock %}
  </div>
</header>
